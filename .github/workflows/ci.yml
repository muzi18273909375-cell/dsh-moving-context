name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查
        run: |
          node --check src/move-session.mjs
          node --check src/e2e-check.mjs
          node --check test/run-tests.mjs
          node --check test/make-fixture.mjs
      - name: 跑测试（合成沙箱，不碰真实数据）
        run: npm test
